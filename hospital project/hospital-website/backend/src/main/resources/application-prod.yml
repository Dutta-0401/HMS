server:
  port: 5000

spring:
  application:
    name: hospital-booking-api
  
  # PostgreSQL Database (Production)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hospitaldb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  h2:
    console:
      enabled: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-production-secret-key-min-256-bits-change-this}
  expiration: 86400000

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:https://your-production-domain.com}

# Logging
logging:
  level:
    com.hospital: INFO
    org.springframework: WARN

# Disable Swagger in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
